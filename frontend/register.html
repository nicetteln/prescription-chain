<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enregistrer une ordonnance · Prescription Chain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="register.html">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      Prescription Chain
    </a>
    <nav class="nav">
      <a href="register.html" aria-current="page">Enregistrer</a>
      <a href="verify.html">Vérifier</a>
    </nav>
  </header>

  <main class="page">
    <div>
      <h1>Enregistrer une ordonnance</h1>
    </div>

    <form class="card" id="registerForm" novalidate>
      <div class="wallet">
        <span class="step">1 · Portefeuille</span>
        <button id="connectBtn" type="button" class="btn btn-secondary">Connecter MetaMask</button>
        <span id="account" class="pill" hidden></span>
      </div>

      <div>
        <label class="field-label" for="prescriptionId">2 · Identifiant de l'ordonnance</label>
        <input class="input" id="prescriptionId" type="text" placeholder="ex. RX-2026-0001" autocomplete="off">
      </div>

      <div>
        <label class="field-label" for="pdfFile">3 · Fichier PDF</label>
        <div class="dropzone">
          <input id="pdfFile" type="file" accept="application/pdf">
        </div>
        <p class="hint">PDF uniquement, 5 Mo maximum.</p>
      </div>

      <button id="submitBtn" type="submit" class="btn btn-primary" disabled>Enregistrer sur la blockchain</button>
    </form>

    <section id="result" class="result" data-state="success" aria-live="polite" hidden>
      <div class="banner">
        <span class="spinner" aria-hidden="true"></span>
        <svg class="icon icon-ok" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        <svg class="icon icon-err" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div>
          <h2 id="resultTitle">Enregistrée sur la blockchain</h2>
          <p id="resultText"></p>
        </div>
      </div>
      <dl class="rows">
        <div class="row"><dt>Empreinte SHA-256</dt><dd class="mono" id="outHash">—</dd></div>
        <div class="row"><dt>CID IPFS</dt><dd class="mono" id="outCid">—</dd></div>
        <div class="row"><dt>Transaction</dt><dd class="mono" id="outTx">—</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
